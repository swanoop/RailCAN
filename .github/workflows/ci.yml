name: Test and package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.10'
          - os: ubuntu-latest
            python: '3.12'
          - os: ubuntu-latest
            python: '3.13'
          - os: windows-latest
            python: '3.12'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and local API tests
        run: python -m unittest discover -s tests -v
      - name: Package build
        run: |
          python -m pip install build
          python -m build
      - name: Verify installed entry point
        shell: bash
        run: |
          python -m pip install dist/*.whl
          railcan --version
          railcan simulate --duration 1 --out ci-capture.log
          railcan inspect ci-capture.log
